name: 验证

# 每次推送与 PR 都跑一遍验证套件。
#
# 为什么值得有：这个项目的所有结论都是"实测出来的"，
# 而不是"看起来应该对"。没有 CI 的话，下一个人改完代码
# 只能靠手工跑一堆脚本才知道有没有弄坏东西。
#
# 注意：跑的是**后端套件**（认证 / 账号 / 出单 / 真实 CouchDB / 同步代理）。
# 界面套件需要 Chromium，本地跑更合适，不放在这里。

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # 与生产用同一个大版本，避免"CI 过了但线上挂"
      couchdb:
        image: couchdb:3.5
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: ci-test-pass
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -fsS -u admin:ci-test-pass http://127.0.0.1:5984/ >/dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      COUCHDB_URL: http://127.0.0.1:5984
      COUCHDB_ADMIN_USER: admin
      COUCHDB_ADMIN_PASS: ci-test-pass
      COUCHDB_APP_USER: app
      COUCHDB_APP_PASS: app-ci-pass
      COUCHDB_DB: orders
      # 免密登录只在回环地址上生效，CI 里服务绑 127.0.0.1 所以可用。
      # 这样测试脚本不必硬编码密码。
      DEV_ALLOW_PASSWORDLESS_LOGIN: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 依赖分三部分，缺一个后续步骤就会以奇怪的方式失败：
      #   · pouchdb        界面需要浏览器构建，后端套件用 Node 构建
      #   · puppeteer-core 多图排版 / 单机版验证要真开浏览器量高度
      #   · esbuild        前端降级构建（devDependency），
      #                    把 ?? / ?. 转成旧手机能解析的写法
      #
      # ⚠️ 这里**不能**用 `npm install --no-save <包>` 来装 pouchdb——
      #    它会把不在 package.json 里的包当成"多余依赖"顺手清掉，
      #    本机就被这个坑过一次（esbuild 被删，服务端起不来）。
      #    先 `npm ci` 按清单装齐，再单独 --no-save 补 pouchdb。
      - name: 安装验证所需依赖
        run: |
          cd sync && npm ci --no-audit --no-fund
          cd ../app
          npm ci --no-audit --no-fund
          npm install --no-save --no-audit --no-fund pouchdb
          # 装完立刻验证，别等跑到一半才发现缺东西
          node -e "require.resolve('esbuild'); require.resolve('puppeteer-core'); console.log('依赖就绪')"

      - name: 生成 PouchDB 浏览器构建
        run: cd app && node tools/vendor-pouchdb.mjs

      # 出单套件需要产品数据才能跑（至少 2 款：一款测目录价、一款测让价）。
      # data/ 是 gitignore 的，checkout 出来是空的，所以必须先导入示例数据。
      #
      # ⚠️ 这一步最初漏了，CI 从第一次推送起就一直是红的。
      #    教训：**CI 里跑的应该是"新人照文档做一遍"的完整流程**，
      #    而不是"在我已经配好的机器上能跑的东西"。
      - name: 导入示例数据
        run: cd app && node tools/seed-sample-data.mjs

      # 多图排版：图片数量不设上限之后，画册还塞得进 A4 吗。
      #
      # ⚠️ 这一项**只能在 CI 里做**：它要真的开浏览器逐页量高度，
      #    而开发机上不一定有可用的浏览器。
      #    实测：某些受限环境禁止命名管道，Chromium 的 mojo 起不来，
      #    连命令行的 --print-to-pdf 都用不了（6 组参数全 FATAL）。
      #    那种情况下用 tools/check-catalog-fit.mjs 做静态核算兜底。
      #
      # ⚠️ 这里有三层，各有各的用，缺一层就会漏掉一类问题：
      #
      #   check-catalog-fit      纯毫米核算，不开浏览器。改 PER_PAGE 或页边距时
      #                          能立刻发现"卡片比 A4 还高"。
      #   verify-multi-image     真开浏览器逐页量高度，验证多图排版不溢出。
      #   check-catalog-truncation  验证**截断行为**，而且验证"检查本身是活的"：
      #      · 当初 assertLayout 把视口高度设成 A4 高度 → 永远报通过，
      #        是个不报错的死断言。故意塞爆必须能报出来，否则等于没检查。
      #      · 现在卡片行高固定，内容再多也撑不破页（会被裁）。
      #        所以重点转向：截断必须是"有意的"（限行+省略号），
      #        而且**价格与库存永远不能被裁**——那是成交信息。
      - name: 多图排版
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
        run: |
          which chromium chromium-browser google-chrome || true
          cd app
          node tools/check-catalog-fit.mjs
          node tools/verify-multi-image.mjs
          node tools/check-catalog-truncation.mjs

      # 旧手机兼容性：源码里的 ?? / ?. 要 Chrome 80+，
      # 而 Android 10 上的 Edge 内核停在 77 —— 直接 SyntaxError，整个脚本不执行。
      # 这里验证降级产物真的不含这些语法。
      #
      # 同时打包单机版并在真浏览器里打开它（file:// 协议）——
      # 单机版是"发个文件到手机点开就用"的交付物，
      # 曾经因为残留 <script src="/app.js"> 而在 file:// 下整个加载失败，
      # 那次的症状是"标题和骨架都在、但脚本一行没跑"，必须由 CI 兜住。
      - name: 旧浏览器兼容性
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
        run: |
          cd app
          node tools/verify-legacy-compat.mjs
          node tools/build-solo.mjs
          node tools/verify-solo-in-browser.mjs

      # 订单导出：CSV 转义和公式注入这两件事**不看数据发现不了**。
      # 客户名里一个逗号就能让整张表列错位，而人会先去怀疑统计逻辑。
      # 这里纯逻辑验证，不需要服务端。
      - name: 订单导出
        run: cd app && node tools/verify-export.mjs

      - name: 启动服务端
        run: |
          cd app
          # 删掉账号文件，让它重新初始化 —— 这样能顺便验证
          # "首次启动自动生成初始密码"这条链路本身。
          rm -f data/sales.json data/current-sales.json
          node server/index.mjs > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/session >/dev/null 2>&1; then
              echo "服务端已就绪"; break
            fi
            sleep 1
          done
          cat /tmp/server.log

      # 从启动日志里抓初始密码，供 verify-auth 用真实密码路径跑。
      # 不硬编码密码：每次 CI 都是新生成的。
      - name: 提取初始密码
        run: |
          grep -E '^ +[a-z0-9_]+ +[a-z0-9]{10} +（' /tmp/server.log > /tmp/pw.txt || true
          cat /tmp/pw.txt
          for n in admin alice bob; do
            v=$(awk -v n="$n" '$1==n {print $2}' /tmp/pw.txt | head -1)
            echo "PW_$(echo $n | tr a-z A-Z)=$v" >> "$GITHUB_ENV"
          done
          echo "已提取："; grep '^PW_' "$GITHUB_ENV" | sed 's/=.*/=<已隐藏>/'

      - name: 出单模块
        run: cd app && node tools/verify-orders.mjs

      - name: 真实 CouchDB 隔离
        run: cd app && node tools/verify-real-couchdb.mjs

      - name: 同步代理授权
        run: cd app && node tools/verify-sync-proxy.mjs

      - name: 认证
        run: cd app && node tools/verify-auth.mjs

      - name: 账号管理
        run: cd app && node tools/verify-accounts.mjs

      - name: 失败时输出服务端日志
        if: failure()
        run: cat /tmp/server.log || true
